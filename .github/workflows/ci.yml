name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

      - name: shellcheck
        run: |
          files=$(git ls-files '*.sh')
          if [ -n "$files" ]; then
            # shellcheck disable=SC2086
            shellcheck $files
          fi

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install pytest pyyaml

      - name: pytest
        run: python -m pytest -q tests

  # The reusable workflows, run on this repository from this commit: the
  # labels as a dry run, and a housekeeping report without a webhook.
  labels-dry-run:
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/labels.yml
    with:
      toolkit-ref: ${{ github.sha }}

  housekeeping-report:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/housekeeping.yml
    with:
      toolkit-ref: ${{ github.sha }}
      reminders: |
        This is a test run.
